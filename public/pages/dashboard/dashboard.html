<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="../../css/style.css" />
</head>
<body onload="loadDashboardPage()">
  <header class="topbar">
    <a class="back-link" href="../../index.html">← Accueil</a>
    <h1 class="title">📊 Dashboard</h1>
  </header>

  <main class="dashboard-page">
    <section class="dashboard-grid">
      <div class="dashboard-card">
        <h3>Total des cours</h3>
        <p id="totalCourses">0</p>
      </div>

      <div class="dashboard-card">
        <h3>Cours vus</h3>
        <p id="watchedCoursesCount">0</p>
      </div>

      <div class="dashboard-card">
        <h3>Favoris</h3>
        <p id="favoriteCoursesCount">0</p>
      </div>

      <div class="dashboard-card">
        <h3>Progression globale</h3>
        <p id="globalProgress">0%</p>
      </div>
    </section>

    <section class="dashboard-progress-section">
      <h2>Progression par catégorie</h2>
      <div id="categoryProgressList"></div>
    </section>
  </main>

  <script src="../../js/app.js"></script>
</body>
</html>
