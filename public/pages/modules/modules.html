<!DOCTYPE html>

  <title>Modules</title>
  <link rel="stylesheet" href="../../css/style.css" />

<body onload="loadModulesPage()">

    <div id="modulesList" class="modules-grid"></div>
  </main>

  <script src="../../js/app.js"></script>

</html>
