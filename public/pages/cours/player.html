<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Lecteur de cours</title>

  <link rel="stylesheet" href="../../css/style.css?v=20260718-4" />

  <link
    rel="stylesheet"
    href="/css/mobile-responsive.css"
  />
</head>

<body>

  <header class="topbar">
    <a
      class="back-link"
      id="backToModules"
      href="../modules/modules.html"
    >
      ← Modules
    </a>

    <h1 class="title">
      🎬 Lecteur de cours
    </h1>
  </header>

  <main class="player-layout">

    <section class="player-main">

      <div class="video-wrapper">

        <video
          id="videoPlayer"
          controls
          controlsList="nodownload noremoteplayback"
          disablePictureInPicture
          playsinline
          oncontextmenu="return false;"
        ></video>

        <div
          id="nextMiniature"
          class="next-miniature"
        >
          <div class="mini-thumb">
            ▶
          </div>

          <div class="mini-info">
            <strong>
              Vidéo suivante
            </strong>

            <p id="nextMiniTitle">
              ...
            </p>

            <small>
              Démarrage dans
              <span id="nextMiniCountdown">
                5
              </span>
              s
            </small>
          </div>

          <button
  id="playNextMini"
  class="next-play-button"
  type="button"
  aria-label="Lire le cours suivant"
>
  <span class="next-play-icon">▶</span>
  <span class="next-play-label">Continuer</span>
</button>

          <button
  id="cancelNextMini"
  class="next-cancel-button"
  type="button"
  aria-label="Annuler le passage automatique"
>
  ✕
</button>
        </div>

      </div>

      <div class="player-actions">

        <button
          id="watchedBtn"
          class="btn btn-gold"
          type="button"
        >
          ✔ Déjà vu
        </button>

        <div
          class="pdf-actions"
          id="quickSupports"
        ></div>

        <button
          id="favoriteBtn"
          class="btn btn-dark"
          type="button"
        >
          ⭐ Favoris
        </button>

      </div>

      <section
        id="pdfSection"
        class="pdf-section hidden"
      >

        <div class="pdf-section-header">
          <h3>Support PDF</h3>
        </div>

        <div
          id="pdfUnavailable"
          class="pdf-unavailable hidden"
        >
          Aucun support disponible pour ce cours.
        </div>

        <div
          id="supportsList"
          class="supports-list"
        ></div>

        <iframe
          id="pdfViewer"
          class="pdf-viewer hidden"
          title="Aperçu du PDF"
        ></iframe>

      </section>

      <div
        id="courseEndBox"
        class="course-end-box hidden"
      >

        <h3 id="courseEndTitle">
          Cours terminé
        </h3>

        <p id="courseEndText">
          Tu peux passer au cours suivant.
        </p>

        <div
          id="autoNextInfo"
          class="auto-next-info hidden"
        >
          Passage automatique dans
          <span id="autoNextCountdown">
            5
          </span>
          s...
        </div>

        <div class="course-end-actions">

          <button
            id="nextCourseBtn"
            class="btn btn-gold"
            type="button"
          >
            ▶ Cours suivant
          </button>

          <a
            id="backToModuleBtn"
            class="btn btn-dark back-module-btn"
            href="../modules/modules.html"
          >
            ← Retour aux modules
          </a>

        </div>

      </div>

    </section>

    <aside class="player-sidebar">

      <h2
        id="moduleName"
        class="sidebar-title"
      >
        Module
      </h2>

      <div class="progress-box">

        <div
          class="progress-text"
          id="progressText"
        >
          0 / 0 cours vus - 0%
        </div>

        <div class="progress-bar">
          <div
            class="progress-fill"
            id="progressFill"
          ></div>
        </div>

      </div>

      <input
        type="text"
        id="courseSearch"
        placeholder="Rechercher un cours..."
        class="search-input"
      />

      <div
        id="videoList"
        class="course-list"
      ></div>

    </aside>

  </main>

  <script src="../../js/course-pdf-map.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script src="/js/user-storage.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const category = params.get("category");

    if (!category) return;

    const modulesUrl =
      `/pages/modules/modules.html?category=${encodeURIComponent(category)}`;

    const topBack = document.getElementById("backToModules");
    const bottomBack = document.getElementById("backToModuleBtn");

    if (topBack) {
      topBack.href = modulesUrl;
    }

    if (bottomBack) {
      bottomBack.href = modulesUrl;
    }
  });
</script>
  <script src="/js/player.js?v=20260718-1"></script>
  <script src="/js/mobile-menu.js"></script>

  <script src="/js/pcr-capacitor-only.js?v=20260728-3" defer></script>
</body>
</html>
