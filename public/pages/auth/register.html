<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Pré-inscription PCR</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>

<main class="auth-page">
  <section class="auth-card">
    <h1>Pré-inscription</h1>
    <p>Votre compte sera validé par l’administrateur.</p>

    <input id="name" placeholder="Nom complet" />
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Mot de passe" />
    <input id="phone" placeholder="Téléphone" />
    <input id="university" placeholder="Université" />
    <input id="promotion" placeholder="Promotion ex: Résidanat 2026" />

    <button id="registerBtn">Envoyer la demande</button>

    <a href="/pages/auth/login.html">J’ai déjà un compte</a>
  </section>
</main>

<script src="/js/register.js"></script>
</body>
</html>
