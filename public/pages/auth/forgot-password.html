<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Mot de passe oublié - PCR
  </title>

  <link
    rel="stylesheet"
    href="/css/auth.css?v=20260718-20"
  />

  <link
    rel="stylesheet"
    href="/css/mobile-responsive.css"
  />
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-icon">
        🔐
      </div>

      <h1>
        Mot de passe oublié
      </h1>

      <p>
        Saisissez l'adresse e-mail
        associée à votre compte.
      </p>

      <form id="forgotPasswordForm">

        <input
          id="forgotEmail"
          name="email"
          type="email"
          placeholder="Adresse e-mail"
          autocomplete="email"
          inputmode="email"
          required
        />

        <button
          id="forgotPasswordBtn"
          type="submit"
        >
          Envoyer le lien
        </button>

      </form>

      <div
        id="forgotMessage"
        class="auth-message hidden"
        aria-live="polite"
      ></div>

      <a
        class="auth-secondary-link"
        href="/pages/auth/login.html"
      >
        ← Retour à la connexion
      </a>

    </section>

  </main>

  <script
    src="/js/forgot-password.js?v=20260718-20"
  ></script>

</body>
</html>
