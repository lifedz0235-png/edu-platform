<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Nouveau mot de passe - PCR
  </title>

  <link
    rel="stylesheet"
    href="/css/auth.css?v=20260718-20"
  />

  <link
    rel="stylesheet"
    href="/css/mobile-responsive.css"
  />
</head>

<body>

  <main class="auth-page">

    <section class="auth-card">

      <div class="auth-icon">
        🔑
      </div>

      <h1>
        Nouveau mot de passe
      </h1>

      <p>
        Choisissez un nouveau
        mot de passe sécurisé.
      </p>

      <div
        id="resetLoading"
        class="auth-message info"
      >
        Vérification du lien...
      </div>

      <form
        id="resetPasswordForm"
        class="hidden"
      >

        <input
          id="newPassword"
          name="password"
          type="password"
          placeholder="Nouveau mot de passe"
          autocomplete="new-password"
          minlength="8"
          required
        />

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          placeholder="Confirmer le mot de passe"
          autocomplete="new-password"
          minlength="8"
          enterkeyhint="done"
          required
        />

        <small class="password-rule">
          8 caractères minimum,
          avec au moins une lettre
          et un chiffre.
        </small>

        <button
          id="resetPasswordBtn"
          type="submit"
        >
          Modifier le mot de passe
        </button>

      </form>

      <div
        id="resetMessage"
        class="auth-message hidden"
        aria-live="polite"
      ></div>

      <a
        class="auth-secondary-link"
        href="/pages/auth/login.html"
      >
        ← Retour à la connexion
      </a>

    </section>

  </main>

  <script
    src="/js/reset-password.js?v=20260718-20"
  ></script>

</body>
</html>
